<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mahasiswa - Wombat University</title>
    <link href="/css/dashboard-mahasiswa.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="premium-top-banner"></div>

    <nav class="navbar navbar-expand-lg navbar-dark custom-nav py-3">
        <div class="container px-4 d-flex justify-content-between align-items-center">
            <img src="/image/wombat-logo.png" class="brand-logo" alt="Wombat Logo">
            
            <div class="d-flex align-items-center gap-3">
                <div class="text-end user-details-box">
                    <span class="d-block fw-bold text-white header-name" th:text="${mahasiswa.nama}">Niki Kucing</span>
                    <span class="badge text-gold p-0" style="font-size: 0.8rem;">NPM: <span th:text="${mahasiswa.nim}">6182401234</span></span>
                </div>
                <div class="vertical-divider"></div>
                <a href="/" class="btn-logout-luxury">
                    <i class="bi bi-box-arrow-right"></i> Keluar
                </a>
            </div>
        </div>
    </nav>

    <div class="container dashboard-container">
        
        <div class="welcome-luxury-box mb-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h2 class="fw-bold text-white mb-1">Selamat Datang, <span th:text="${mahasiswa.nama}">Niki Kucing</span>.</h2>
                    <p class="text-gold-light m-0">Silakan pilih menu di bawah untuk mengakses portal akademik Anda.</p>
                </div>
                <div class="status-pill">
                    <span class="pulse-dot"></span> Status: Mahasiswa Aktif
                </div>
            </div>
        </div>

        <div class="menu-luxury-grid">
            
            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-person-card-checklist"></i></div>
                <p>PROFIL MAHASISWA</p>
            </a>

            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-calendar2-check"></i></div>
                <p>KEHADIRAN & PRESENSI</p>
            </a>

            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-cash-coin"></i></div>
                <p>PENGISIAN FRS</p>
            </a>

            <a th:href="@{/web/history}" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-file-earmark-spreadsheet"></i></div>
                <p>HISTORY FRS</p>
            </a>

            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-mortarboard-fill"></i></div>
                <p>JADWAL PERKULIAHAN</p>
            </a>

            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-chat-square-heart"></i></div>
                <p>ANGKET DOSEN</p>
            </a>

            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-book-half"></i></div>
                <p>PERPUSTAKAAN DIGITAL</p>
            </a>

            <a href="#" class="menu-item-card">
                <div class="icon-circle"><i class="bi bi-megaphone-fill"></i></div>
                <p>SUARA MAHASISWA</p>
            </a>

        </div>
    </div>
</body>
</html>
