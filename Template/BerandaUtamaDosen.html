<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portal Dosen - Universitas Wombat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === VARIABEL WARNA & DASAR === */
        :root {
            --primary-green: #1B4332;
            --primary-green-dark: #0f291e;
            --accent-gold: #D4AF37;
            --text-dark: #334155;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-hover-bg: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #cbd5e1;
            background-image: linear-gradient(135deg, rgba(27, 67, 50, 0.85) 0%, rgba(212, 175, 55, 0.3) 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        h1, h2, h3 { font-family: 'Poppins', sans-serif; }

        /* === LAYOUT UTAMA KETENGAH === */
        .app-container { 
            display: flex; 
            justify-content: center; /* Memusatkan konten secara horizontal */
            width: 100%; 
            height: 100%; 
            padding: 40px 20px; 
        }

        /* === KONTEN UTAMA === */
        .main-content { 
            width: 100%;
            max-width: 900px; /* Membatasi lebar maksimal agar tidak terlalu memanjang */
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            overflow-y: auto; 
        }
        
        /* Top Bar */
        .top-bar { 
            background: var(--glass-bg); 
            backdrop-filter: blur(15px); 
            border-radius: 20px; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--glass-border); 
            flex-shrink: 0; 
        }

        /* Logo Brand di Top Bar */
        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .brand h2 { color: var(--primary-green); font-size: 20px; line-height: 1.2; margin: 0;}

        .user-info { display: flex; gap: 15px; align-items: center; margin-left: auto; }
        .user-info .text { text-align: right; }
        .user-info .text p:first-child { font-size: 14px; font-weight: bold; margin-bottom: 0; }
        .user-info .text p:last-child { font-size: 12px; color: var(--text-muted); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-green); color: white; display: grid; place-items: center; border: 2px solid var(--accent-gold); font-weight: bold; }
        .logout-btn { color: #ef4444; font-size: 20px; cursor: pointer; margin-left: 10px; transition: transform 0.2s;}
        .logout-btn:hover { transform: scale(1.1); }

        /* Banner Selamat Datang */
        .welcome-banner {
            background: linear-gradient(135deg, var(--primary-green) 0%, #2D6A4F 100%);
            border-radius: 20px;
            padding: 30px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .welcome-text h1 { font-size: 26px; margin-bottom: 5px; color: var(--accent-gold); }
        .welcome-text p { font-size: 14px; opacity: 0.9; }

        /* === GRID MENU DASHBOARD (BENTO UI) === */
        .menu-grid {
            display: grid;
            /* Karena sisa 4 menu, kita buat menjadi grid 2 kolom yang rapi */
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent-gold);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover-bg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: var(--accent-gold);
        }

        .menu-card:hover::before { opacity: 1; }

        .icon-wrapper {
            width: 50px; height: 50px;
            background: rgba(27, 67, 50, 0.1);
            border-radius: 12px;
            display: grid; place-items: center;
            font-size: 20px;
            color: var(--primary-green);
            transition: all 0.3s;
        }

        .menu-card:hover .icon-wrapper {
            background: var(--primary-green);
            color: var(--accent-gold);
            transform: scale(1.1) rotate(5deg);
        }

        .menu-info h3 { font-size: 16px; color: var(--primary-green); margin-bottom: 5px; }
        .menu-info p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        .notification-dot {
            position: absolute; top: 20px; right: 20px;
            background: #ef4444; color: white;
            font-size: 10px; font-weight: bold;
            padding: 3px 8px; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(239, 68, 68, 0.4);
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- KONTEN UTAMA DIBUAT KETENGAH -->
        <main class="main-content">
            
            <div class="top-bar">
                <div class="brand">
                    <i class="fa-solid fa-paw" style="font-size: 26px; color: var(--primary-green);"></i>
                    <h2>Universitas Wombat</h2>
                </div>
                <div class="user-info">
                    <div class="text">
                        <p>Prof. Dr. Barnaby Burrow</p>
                        <p>NIK. 19870512001</p>
                    </div>
                    <div class="avatar">B</div>
                    <i class="fa-solid fa-right-from-bracket logout-btn" title="Keluar"></i>
                </div>
            </div>

            <div class="welcome-banner">
                <div class="welcome-text">
                    <h1>Selamat Datang, Prof. Barnaby!</h1>
                    <p>Semester Genap 2025/2026</p>
                </div>
            </div>

            <div class="menu-grid">
                
                <div class="menu-card">
                    <div class="icon-wrapper"><i class="fa-solid fa-user-tie"><a href="../templates/ProfilDosen.html" id="dosen-btn"></a></i></div>
                    <div class="menu-info">
                        <h3>Profil Dosen</h3>
                        <a href="../templates/ProfilDosen.html" id="dosen-btn"></a>
                        <!-- <p>Kelola pembukaan kelas, sesi, dan kuota mahasiswa untuk semester ini.</p> -->
                    </div>
                </div>

                <div class="menu-card">
                    <div class="icon-wrapper"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <div class="menu-info">
                        <h3>Manajemen Kelas</h3>
                        <!-- <p>Kelola pembukaan kelas, sesi, dan kuota mahasiswa untuk semester ini.</p> -->
                    </div>
                </div>

                <div class="menu-card">
                    <!-- <span class="notification-dot">2 Revisi</span> -->
                    <div class="icon-wrapper"><i class="fa-solid fa-file-signature"></i></div>
                    <div class="menu-info">
                        <h3>Persetujuan FRS</h3>
                        <!-- <p>Tinjau dan setujui Rencana Studi mahasiswa perwalian Anda.</p> -->
                    </div>
                </div>

                <div class="menu-card">
                    <div class="icon-wrapper"><i class="fa-solid fa-calendar-days"></i></div>
                    <div class="menu-info">
                        <h3>Jadwal Keseluruhan</h3>
                        <!-- <p>Lihat agenda mengajar mingguan dan isi Berita Acara Perkuliahan (BAP).</p> -->
                    </div>
                </div>

                <div class="menu-card">
                    <div class="icon-wrapper"><i class="fa-solid fa-calendar-days"></i></div>
                    <div class="menu-info">
                        <h3>Jadwal Mengajar Hari Ini</h3>
                        <!-- <p>Lihat agenda mengajar mingguan dan isi Berita Acara Perkuliahan (BAP).</p> -->
                    </div>
                </div>

                <div class="menu-card">
                    <div class="icon-wrapper"><i class="fa-solid fa-a"></i></div>
                    <div class="menu-info">
                        <h3>Input Nilai</h3>
                        <!-- <p>Entri nilai UTS, UAS, dan tugas akhir mahasiswa di kelas Anda.</p> -->
                    </div>
                </div>

            </div>

        </main>
    </div>

</body>
</html>
